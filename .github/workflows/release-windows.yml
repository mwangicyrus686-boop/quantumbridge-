name: Build and publish Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release version tag (for example v1.0.0)
        required: true
        default: v1.0.0
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm.cmd ci

      - name: Build app
        run: npm.cmd run build

      - name: Package Windows app
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:RUNNER_TEMP 'QuantumBridge'
          $zipPath = Join-Path $env:RUNNER_TEMP 'QuantumBridge_MCP_Bot_Server_Windows.zip'
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          Copy-Item -LiteralPath 'api-server.mjs','mcp-server.mjs','Launch QuantumBridge.bat','README.md' -Destination $packageDir
          Copy-Item -LiteralPath 'dist' -Destination $packageDir -Recurse
          Compress-Archive -Path $packageDir -DestinationPath $zipPath -Force
          "PACKAGE_PATH=$zipPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Choose release tag
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          $releaseTag = $env:REQUESTED_TAG
          if ([string]::IsNullOrWhiteSpace($releaseTag)) { $releaseTag = $env:GITHUB_REF_NAME }
          if ($releaseTag -notmatch '^v\d+\.\d+\.\d+$') { throw 'Use a version tag such as v1.0.0.' }
          "RELEASE_TAG=$releaseTag" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:RELEASE_TAG" "$env:PACKAGE_PATH" `
            --title "QuantumBridge $env:RELEASE_TAG" `
            --generate-notes

